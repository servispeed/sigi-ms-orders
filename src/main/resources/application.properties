# --- SERVIDOR ---
server.port=8082
spring.application.name=ordenes-service

# --- BASE DE DATOS ---
spring.datasource.url=jdbc:postgresql://74.208.192.175:5432/sigi
spring.datasource.username=admin
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.open-in-view=false

# --- Archivos ---
file.upload-dir=uploads

# --- MQTT ---
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=ordenes-service-publisher
mqtt.default-topic=sigi/notifications/ordenes
mqtt.connection-timeout=10
mqtt.keep-alive-interval=30