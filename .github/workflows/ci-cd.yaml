name: CI/CD Pipeline - ms-orders

on:
  push:
    branches: [ "main", "testing" ]
  pull_request:
    branches: [ "develop", "testing", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar ignorando pruebas
        run: mvn clean package -DskipTests

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: ms-orders-jar
          path: target/*.jar

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
    needs: build
    runs-on: self-hosted
    
    steps:
      - name: Checkout del código en el servidor
        uses: actions/checkout@v4

      - name: Descargar artefacto compilado
        uses: actions/download-artifact@v4
        with:
          name: ms-orders-jar
          path: target/

      - name: Desplegar Producción (main)
        if: github.ref == 'refs/heads/main'
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          docker compose -f docker-compose.prod.yaml down || true
          docker compose -f docker-compose.prod.yaml up -d --build
          docker system prune -f

      - name: Desplegar Testing (testing)
        if: github.ref == 'refs/heads/testing'
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          docker compose -f docker-compose.test.yaml down || true
          docker compose -f docker-compose.test.yaml up -d --build